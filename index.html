<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GenU YPAT Global Dashboard</title>
<style>
:root {
  /* GenU Branding Colors */
  --genu-navy: #001a4d; /* Deep background blue */
  --genu-blue: #0b2e7a; /* Lighter card blue */
  --genu-cyan: #00aeef; /* GenU accent color */
  --genu-white: #ffffff;
  --text-muted: #b0c4de;
  --line: rgba(255, 255, 255, 0.15);
  --shadow: 0 10px 30px rgba(0,0,0,0.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  color: var(--genu-white);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  /* The blue now covers the whole background */
  background: linear-gradient(135deg, var(--genu-navy) 0%, #001133 100%);
  background-attachment: fixed;
  min-height: 100vh;
}

/* HERO SECTION */
.hero {
  padding: 60px 24px 40px;
  text-align: center;
  border-bottom: 1px solid var(--line);
}
.hero h1 {
  font-size: clamp(36px, 5vw, 64px);
  font-weight: 700;
  margin-bottom: 12px;
}
.hero .subtitle {
  color: var(--genu-cyan);
  font-size: clamp(16px, 2vw, 24px);
  margin-bottom: 24px;
  font-weight: 600;
}

/* LIBRARY SECTION */
.library {
  max-width: 1400px;
  margin: auto;
  padding: 40px 24px;
}

.sectionhead h2 {
  font-size: 28px;
  margin-bottom: 24px;
  color: var(--genu-white);
}

/* SHELF CARDS (Regions/Profiles) */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 24px;
}

.card {
  background: var(--genu-blue);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 40px rgba(0,174,239,0.2);
}

/* The image container for the shelves */
.card-img-wrap {
  height: 180px;
  width: 100%;
  overflow: hidden;
  position: relative;
}

.card-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.card:hover .card-img-wrap img {
  transform: scale(1.05);
}

.cardcopy {
  padding: 20px;
}

.card h3 {
  font-size: 20px;
  margin-bottom: 8px;
  color: var(--genu-white);
}

.card p {
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.5;
}

/* Custom Scrollbar for a polished look */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--genu-navy); }
::-webkit-scrollbar-thumb { background: var(--genu-blue); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--genu-cyan); }

</style>
</head>
<body>

<section class="hero">
  <h1>YPAT Global Dashboard</h1>
  <p class="subtitle">Generation Unlimited · Young People's Action Team</p>
</section>

<main class="library">
  <div class="sectionhead">
    <h2>Youth Regions & Portfolios</h2>
  </div>
  
  <div class="grid" id="grid">
    <!-- JS will inject the cards here -->
  </div>
</main>

<script>
// This is where you will insert your YPAT data
const regions = [
  {
    title: "African Region",
    tagline: "15 YPATs representing 8 African nations.",
    img: "https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?w=700&q=80&fit=crop" // Replace with your image
  },
  {
    title: "Asian Region",
    tagline: "Tracking youth initiatives across Asia.",
    img: "https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=700&q=80&fit=crop"
  },
  {
    title: "The Americas",
    tagline: "Latin America & Caribbean youth impact.",
    img: "https://images.unsplash.com/photo-1518638150340-f706e86654de?w=700&q=80&fit=crop"
  },
  {
    title: "Middle East & North Africa",
    tagline: "MENA region youth initiatives.",
    img: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?w=700&q=80&fit=crop"
  }
];

const grid = document.getElementById('grid');

regions.forEach(region => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-img-wrap">
      <img src="${region.img}" alt="${region.title}">
    </div>
    <div class="cardcopy">
      <h3>${region.title}</h3>
      <p>${region.tagline}</p>
    </div>
  `;
  grid.appendChild(card);
});
</script>

</body>
</html>
