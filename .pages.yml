media:
  - name: library-images
    label: Resource Images
    input: images/resources
    output: /images/resources
    extensions:
      - jpg
      - jpeg
      - png
      - webp
  - name: library-pdfs
    label: Library PDFs
    input: pdfs
    output: /pdfs
    extensions:
      - pdf
content:
  - name: resources
    label: Add Resources
    type: file
    path: data/resources.json
    format: json
    list: true
    fields:
      - name: shelf
        label: Shelf
        type: select
        required: true
        options:
          values:
            - Book
            - Articles & Essays
            - Generation Unlimited Programmes or Opportunities
            - Exercise & Diet
            - Psychology and Mental Models
            - Investing and Financial Literacy
      - name: title
        label: Resource title
        type: string
        required: true
      - name: author
        label: Author
        type: string
      - name: category
        label: Category / Topic (Strategy, Pitch Deck, Regional Context, etc.)
        type: string
      - name: sourceDate
        label: Document / Update Date
        type: date
      - name: image
        label: Cover / Resource Image
        type: image
        options:
          media: library-images
          path: resources
          extensions:
            - jpg
            - jpeg
            - png
            - webp
      - name: pdf
        label: Book / Summary / Source PDF
        type: file
        options:
          media: library-pdfs
          extensions:
            - pdf
      - name: recommended
        label: Recommended articles and links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: kind
            label: Entry type
            type: select
            required: true
            options:
              values:
                - Article
                - Link
          - name: title
            label: Article or link title
            type: string
            required: true
          - name: author
            label: Author
            type: string
          - name: date
            label: Publication date
            type: date
          - name: body
            label: Read here (optional)
            type: rich-text
            description: Add article text here if you want it readable inside the library. Leave blank to link out only.
            options:
              format: html
          - name: url
            label: Original article or link (optional)
            type: string
            description: Paste the full https:// link. Readers can open it on the original site.
      - name: summary
        label: Summary (up to 1,000 words)
        type: rich-text
        description: Use headings, paragraphs, bulleted lists, and numbered lists. Please keep the summary to 1,000 words or fewer. For GenU programme sources, include useful strategy, regional, and update context.
        options:
          format: html
